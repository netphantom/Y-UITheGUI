[project]
name = "yui-backend"
version = "0.1.0"
description = "YuE2 self-hosted backend: user management, projects and song generation queue"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "packaging>=24.0",
]

[project.optional-dependencies]
# The real engine. Installed (and kept up to date) by app/yue/updater.py at startup.
yue = ["yue2-infer @ git+https://github.com/multimodal-art-projection/YuE.git"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
