services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_YUE: ${INSTALL_YUE:-true}
    env_file: .env
    volumes:
      - ./data:/data   # SQLite DB, generated songs, Hugging Face model cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "${YUI_PORT:-8080}:80"
    restart: unless-stopped
