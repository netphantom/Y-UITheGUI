# Y-UI deployment: prebuilt images from GitHub Container Registry.
# Settings live in .env (see .env.example); add-on files are selected with COMPOSE_FILE:
#   docker-compose.gpu.yml  NVIDIA GPU access for the real YuE2 engine
#   docker-compose.dev.yml  build the images from this checkout instead of pulling them
name: y-ui

services:
  backend:
    image: ghcr.io/netphantom/y-uithegui-backend:${YUI_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    volumes:
      # SQLite DB, generated songs, YuE2 virtualenv and the Hugging Face model cache.
      - ${YUI_DATA_PATH:-./data}:/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/netphantom/y-uithegui-frontend:${YUI_VERSION:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${YUI_BIND:-0.0.0.0}:${YUI_PORT:-8080}:80"
    restart: unless-stopped
